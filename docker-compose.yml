services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xpo
      POSTGRES_PASSWORD: xpo_dev_password
      POSTGRES_DB: xpo
    ports:
      - "5433:5432"
    volumes:
      - xpo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpo -d xpo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  xpo-pgdata:
